<style>
  :root{
    --bg:#020617; --fg:#f8fafc; --muted-fg:#94a3b8; --border:#334155;
    --cy:#46e0ff; --cy2:#5aa8ff;
    --st-online:#ffffff; --st-inuse:#46e0ff; --st-down:#ff4d6a; --st-idle:#ffce4d;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; color:var(--fg); }
  .mono{ font-family:"Share Tech Mono",ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Consolas,Menlo,monospace; }
  button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{ outline:2px solid var(--cy); outline-offset:2px; }
  button:focus:not(:focus-visible){ outline:none; }
  #gl{ position:fixed; inset:0; z-index:0; display:block; width:100vw; height:100dvh; touch-action:none; cursor:default; }

  /* HUD */
  #hud{ position:fixed; inset:0; z-index:4; pointer-events:none; }
  .brk{ position:absolute; width:26px; height:26px; border:2px solid rgba(70,224,255,.4); }
  .tl{ top:calc(14px + env(safe-area-inset-top)); left:14px; border-right:0; border-bottom:0; }
  .tr{ top:calc(14px + env(safe-area-inset-top)); right:14px; border-left:0; border-bottom:0; }
  .bl{ bottom:calc(14px + env(safe-area-inset-bottom)); left:14px; border-right:0; border-top:0; }
  .br{ bottom:calc(14px + env(safe-area-inset-bottom)); right:14px; border-left:0; border-top:0; }
  #title{ position:fixed; top:calc(20px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:5;
    text-align:center; cursor:pointer; }
  #title .t{ font-size:15px; letter-spacing:7px; font-weight:700; color:#eaf3ff; text-shadow:0 0 18px rgba(70,224,255,.6); }
  #title .s{ font-size:9.5px; letter-spacing:4px; color:var(--cy); opacity:.8; margin-top:3px; }
  #readout{ position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:5;
    font-size:10.5px; letter-spacing:2px; color:#9fc8e0; opacity:.85; text-align:center; font-variant-numeric:tabular-nums; }

  #legend{ position:fixed; top:calc(54px + env(safe-area-inset-top)); left:16px; z-index:5;
    font-size:10px; letter-spacing:1.5px; line-height:1.9; color:#a9c4e0; }
  #legend b{ display:block; font-size:9.5px; letter-spacing:3px; color:var(--cy); margin-bottom:5px; opacity:.85; }
  .key{ display:flex; align-items:center; gap:8px; }
  .swatch{ width:18px; height:2px; }
  .sw-white{ background:#fff; box-shadow:0 0 7px #fff; }
  .sw-blue{ background:#46e0ff; box-shadow:0 0 8px #46e0ff; }
  .sw-red{ background:#ff4d6a; box-shadow:0 0 7px #ff4d6a; }
  .sw-yellow{ background:#ffce4d; box-shadow:0 0 7px #ffce4d; }
  #hint{ position:fixed; bottom:calc(44px + env(safe-area-inset-bottom)); left:0; right:0; z-index:5;
    text-align:center; font-size:11px; letter-spacing:3px; color:#7fd4ff; pointer-events:none; transition:opacity .5s;
    text-shadow:0 0 14px rgba(70,224,255,.6); }

  /* floating 3D-projected planet labels */
  #labels{ position:fixed; inset:0; z-index:3; pointer-events:none; }
  .label{ position:absolute; top:0; left:0; transform:translate(-50%,0); white-space:nowrap;
    font-family:"Share Tech Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:1.5px; color:rgba(222,235,255,.92);
    text-shadow:0 1px 4px rgba(0,0,0,.9); transition:opacity .25s; display:flex; align-items:center; gap:6px; }
  .label .dot{ width:6px; height:6px; border-radius:50%; box-shadow:0 0 6px currentColor; }

  #card{ position:fixed; left:50%; bottom:calc(78px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:6; min-width:240px; max-width:84vw; background:rgba(8,14,26,.92); border:1px solid rgba(70,224,255,.3);
    border-radius:6px; padding:15px 17px; box-shadow:0 16px 48px rgba(0,0,0,.6), inset 0 0 22px rgba(70,224,255,.06); display:none; }
  #card h3{ margin:0 0 5px; font-size:13px; letter-spacing:2px; }
  #card .st{ font-size:11px; letter-spacing:1.5px; margin-bottom:8px; font-weight:600; }
  #card p{ margin:0; font-size:12.5px; color:#9fb2d6; line-height:1.5; }
  #card .x{ position:absolute; top:6px; right:8px; cursor:pointer; color:#7d8aa8; pointer-events:auto;
    background:none; border:none; padding:6px; display:grid; place-items:center; border-radius:4px; }
  #card .x:hover{ color:#cfe0f5; }

  #sheet{ position:fixed; inset:0; z-index:10; display:none; }
  #sheet .scrim{ position:absolute; inset:0; background:rgba(2,4,10,.62); backdrop-filter:blur(3px); }
  #panel{ position:absolute; left:0; right:0; bottom:0; max-height:82dvh; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#070c18,#04060d); border-top:1px solid rgba(70,224,255,.28);
    box-shadow:0 -12px 60px rgba(0,0,0,.7), 0 0 40px rgba(70,224,255,.07);
    padding-bottom:env(safe-area-inset-bottom); animation:rise .26s ease; }
  @keyframes rise{ from{ transform:translateY(40px); opacity:.3 } to{ transform:none; opacity:1 } }
  #panel .bar{ display:flex; align-items:center; gap:11px; padding:14px 16px; border-bottom:1px solid rgba(70,224,255,.14); }
  #panel .sun-mini{ width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 38% 35%,#fff3c4,#ffd24d 45%,#ff9e2c 78%); box-shadow:0 0 16px #ffb43a; }
  #panel .bar b{ font-size:14px; letter-spacing:3px; } #panel .bar .grow{ flex:1; }
  #panel .bar .ic{ width:36px; height:36px; border-radius:4px; border:1px solid rgba(70,224,255,.2); cursor:pointer; color:#bcd0ea;
    background:rgba(70,224,255,.06); display:grid; place-items:center; font-size:15px;
    transition:background .18s ease, color .18s ease, border-color .18s ease; }
  #panel .bar .ic:hover{ background:rgba(70,224,255,.14); color:#eaf3ff; border-color:rgba(70,224,255,.4); }
  #log{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; gap:8px; align-items:flex-end; max-width:90%; animation:pop .2s ease; }
  .row.me{ align-self:flex-end; flex-direction:row-reverse; }
  .ava{ width:24px; height:24px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 38% 35%,#fff3c4,#ffd24d 45%,#ff9e2c 78%); box-shadow:0 0 10px #ffb43a; }
  .bubble{ padding:10px 13px; border-radius:13px; line-height:1.45; font-size:15px; word-wrap:break-word; overflow-wrap:anywhere; }
  .me .bubble{ background:linear-gradient(135deg,#1f7fff,#0a5ad6); color:#fff; border-bottom-right-radius:4px; box-shadow:0 0 16px rgba(31,127,255,.3); }
  .her .bubble{ background:rgba(70,224,255,.07); border:1px solid rgba(70,224,255,.16); border-bottom-left-radius:4px; }
  .bubble a{ color:#7fd4ff } .bubble code{ background:rgba(70,224,255,.14); padding:1px 5px; border-radius:4px;
    font-family:"Fira Code",ui-monospace,Menlo,Consolas,monospace; font-size:.92em; }
  .typing .bubble{ display:inline-flex; gap:5px }
  .dot{ width:7px; height:7px; border-radius:50%; background:#6f86b5; animation:blink 1.3s infinite }
  .dot:nth-child(2){ animation-delay:.2s } .dot:nth-child(3){ animation-delay:.4s }
  @keyframes pop{ from{opacity:0;transform:translateY(6px)} to{opacity:1} }
  @keyframes blink{ 0%,60%,100%{opacity:.25} 30%{opacity:1} }

  form{ display:flex; gap:9px; align-items:flex-end; padding:11px 12px; border-top:1px solid rgba(70,224,255,.14); }
  #mic{ width:52px; height:52px; border-radius:50%; border:none; flex:none; cursor:pointer; color:#fff; font-size:23px;
    background:linear-gradient(135deg,#ff8a4c,#ff5e7e); box-shadow:0 4px 18px rgba(255,110,90,.55); display:grid; place-items:center; }
  #mic.listening{ animation:micpulse 1s infinite }
  @keyframes micpulse{ 0%,100%{box-shadow:0 0 0 0 rgba(255,110,90,.6)} 50%{box-shadow:0 0 0 16px rgba(255,110,90,0)} }
  #input{ flex:1; resize:none; border:1px solid rgba(70,224,255,.2); border-radius:14px; padding:12px 15px;
    font-size:16px; line-height:1.35; max-height:120px; background:rgba(70,224,255,.05); color:#eaf3ff; font-family:inherit; outline:none; }
  #input:focus{ border-color:var(--cy) }
  #send{ width:48px; height:48px; border-radius:50%; border:none; flex:none; cursor:pointer; color:#fff; font-size:18px;
    background:rgba(70,224,255,.12); display:grid; place-items:center; }
  #send svg,#mic svg,.ic svg,.x svg{ display:block; }

  #fallback{ position:fixed; inset:0; z-index:8; display:none; place-items:center; text-align:center; padding:30px;
    background:radial-gradient(circle at 50% 40%,#0b1530,#020617); }
  #fallback .inner{ max-width:340px; } #fallback h2{ letter-spacing:4px; font-size:16px; color:#eaf3ff; }
  #fallback p{ color:#9fb2d6; font-size:13px; line-height:1.6; } #fallback button{ margin-top:14px; padding:11px 20px;
    border-radius:8px; border:1px solid rgba(70,224,255,.4); background:rgba(70,224,255,.1); color:#eaf3ff; cursor:pointer; letter-spacing:2px; }

  /* a11y: honour the OS "reduce motion" setting for the DOM chrome.
     The WebGL scene is calmed separately in JS (see REDUCE). */
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>

<script type="module">
const TOKEN = "__SUNNY_TOKEN__";
const TAU = Math.PI * 2;
const RM = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches:false, addEventListener(){} };
let REDUCE = RM.matches;
RM.addEventListener && RM.addEventListener("change", e => { REDUCE = e.matches; });

// Which nodes orbit the core, and how they look. Orbits/sizes are tuned for a
// readable 3D layout; colour is the planet's body tint.
const VIS = {
  search:   { name:"WEB SEARCH",     orbit:0.150, size:15, color:0xa9b6c8, atmo:0x6fa0ff, incl:0.10, tex:{} },
  memory:   { name:"MEMORY",         orbit:0.210, size:18, color:0xf0c46b, atmo:0xffd27a, incl:-0.16, tex:{caps:true} },
  log:      { name:"ACTIVITY LOG",   orbit:0.270, size:14, color:0x47e08a, atmo:0x2ad17a, incl:0.30, tex:{} },
  phone:    { name:"PHONE",          orbit:0.330, size:21, color:0x3f9bff, atmo:0x2e6fff, incl:0.20, tex:{} },
  voice:    { name:"VOICE",          orbit:0.390, size:19, color:0x7e8cff, atmo:0x4a5cff, incl:-0.28, tex:{} },
  watch:    { name:"WATCH",          orbit:0.450, size:17, color:0xff5c4d, atmo:0xff6a5a, incl:0.22, tex:{} },
  upgrade:  { name:"SELF-UPGRADE",   orbit:0.515, size:20, color:0xb46bff, atmo:0x8a3cff, incl:-0.18, tex:{} },
  home:     { name:"HOME ASSISTANT", orbit:0.585, size:27, color:0xe0a572, atmo:0xffb066, incl:0.12, tex:{bands:true} },
  reminders:{ name:"REMINDERS",      orbit:0.655, size:24, color:0xecd99a, atmo:0xffe6a0, incl:-0.10, ring:true, tex:{bands:true} },
  web:      { name:"WEB APP",        orbit:0.720, size:21, color:0x5fe6e0, atmo:0x33c9c4, incl:0.26, tex:{} },
  briefing: { name:"DAILY BRIEFING", orbit:0.785, size:18, color:0xffb84d, atmo:0xff9e2c, incl:-0.24, tex:{} },
  host:     { name:"HOST PC",        orbit:0.855, size:23, color:0x9fb4d4, atmo:0x5a7fb0, incl:0.16, tex:{bands:true} },
};
const ABOUT = {
  search:"Sunny searches the live web to answer current questions.",
  memory:"Things you ask Sunny to remember, kept across sessions.",
  log:"Sunny's activity log — every message and tool call she records.",
  phone:"Your phone over ntfy — text Sunny and get push replies anywhere.",
  voice:"Talk to Sunny out loud. Tap the core, then the mic.",
  watch:"Amazfit GTR 3 Pro app — not linked yet. We build the watch link next.",
  upgrade:"Sunny's self-improvement engine — sandbox-tested and approval-gated.",
  home:"Home Assistant for real device control. Add HA_URL + HA_TOKEN to link.",
  reminders:"Time-based reminders that buzz your phone when due.",
  web:"This web app — the interface you're using right now.",
  briefing:"Her daily morning briefing. Set SUNNY_BRIEFING_TIME to schedule it.",
  host:"The PC Sunny lives on — her body. Online whenever she's running.",
};

const localActive = {};        // web/voice lit locally during a chat
let speakingUntil = 0;         // while Sunny is talking out loud
let sceneReady = false;

/* ============================ 3D SCENE ============================ */
let THREE, composer, renderer, scene, camera, sunMat, planets = [], sunGroup, pointLight;
const ORBIT = 72, SUN_R = 6, FOV = 50;
let camAngle = 0, camR = 104, camH = 38, ox = 0, oy = 0, pmx = 0, pmy = 0;
let startT = performance.now(), lastT = startT;
let W = innerWidth, H = innerHeight;

async function boot(){
  THREE = await import("three");
  const { EffectComposer } = await import("three/addons/postprocessing/EffectComposer.js");
  const { RenderPass } = await import("three/addons/postprocessing/RenderPass.js");
  const { UnrealBloomPass } = await import("three/addons/postprocessing/UnrealBloomPass.js");
  const { OutputPass } = await import("three/addons/postprocessing/OutputPass.js");

  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.domElement.id = "gl";
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02040c);
  camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 4000);
  camera.position.set(0, camH, camR);
  camera.lookAt(0, 0, 0);

  // lights — warm sun light + cool ambient + a soft blue back rim.
  // decay 0: the sun lights every orbit evenly (stylised), but the
  // surface still shades by facing angle, so planets read as sunlit.
  pointLight = new THREE.PointLight(0xffdca8, 2.6, 0, 0);
  scene.add(pointLight);
  scene.add(new THREE.AmbientLight(0x2a3a55, 0.55));
  const rim = new THREE.DirectionalLight(0x4a6cff, 0.5); rim.position.set(-40, 20, -60); scene.add(rim);

  buildStarfield();
  buildNebula();
  buildSun();
  for (const id in VIS) buildPlanet(id, VIS[id]);

  const rp = new RenderPass(scene, camera);
  const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.05, 0.55, 0.55);
  composer = new EffectComposer(renderer);
  composer.addPass(rp);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  composer.setSize(W, H);
  composer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

  addEventListener("resize", onResize);
  sceneReady = true;
  requestAnimationFrame(animate);
}

function glowTexture(){
  const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
  const rg = g.createRadialGradient(64,64,0,64,64,64);
  rg.addColorStop(0,"rgba(255,255,255,1)"); rg.addColorStop(0.25,"rgba(255,240,210,0.85)");
  rg.addColorStop(0.55,"rgba(255,170,80,0.25)"); rg.addColorStop(1,"rgba(255,150,60,0)");
  g.fillStyle = rg; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function buildStarfield(){
  for (const [count, size, spread, bright] of [[2600,0.5,1700,0.55],[900,0.9,1300,0.95]]){
    const pos = new Float32Array(count*3);
    for (let i=0;i<count;i++){
      const r = spread*(0.55+Math.random()*0.45), th = Math.random()*TAU, ph = Math.acos(2*Math.random()-1);
      pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
      pos[i*3+1] = r*Math.cos(ph);
      pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
    const mat = new THREE.PointsMaterial({ size, color:0xcfe0ff, transparent:true, opacity:bright,
      sizeAttenuation:true, depthWrite:false, map:glowTexture(), blending:THREE.AdditiveBlending });
    scene.add(new THREE.Points(geo, mat));
  }
}

function buildNebula(){
  const clouds = [[0x1b2c6b,420,-700,-120,-900],[0x2a1856,520,650,180,-1100],[0x0e4a6e,460,-300,-260,-800],[0x3a2150,500,400,300,-1200]];
  for (const [col,size,x,y,z] of clouds){
    const m = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTexture(), color:col, transparent:true,
      opacity:0.5, depthWrite:false, blending:THREE.AdditiveBlending }));
    m.scale.set(size,size,1); m.position.set(x,y,z); scene.add(m);
  }
}

const SUN_VERT = `varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const SUN_FRAG = `
  varying vec3 vPos; uniform float uTime; uniform float uBoost;
  float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
  float noise(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
  float fbm(vec3 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.02; a*=0.5; } return v; }
  void main(){
    vec3 p = normalize(vPos);
    float n  = fbm(p*2.6 + vec3(0.0, uTime*0.06, uTime*0.02));
    float n2 = fbm(p*6.5 - vec3(uTime*0.10));
    float h = n*0.6 + n2*0.4;
    vec3 cool = vec3(1.0,0.32,0.04);
    vec3 hot  = vec3(1.0,0.86,0.5);
    vec3 col = mix(cool, hot, smoothstep(0.28,0.82,h));
    col += pow(max(h,0.0),4.0)*vec3(1.0,0.9,0.6)*1.6;
    col *= 1.55 + uBoost;
    gl_FragColor = vec4(col,1.0);
  }`;

function buildSun(){
  sunGroup = new THREE.Group(); scene.add(sunGroup);
  sunMat = new THREE.ShaderMaterial({ uniforms:{ uTime:{value:0}, uBoost:{value:0} }, vertexShader:SUN_VERT, fragmentShader:SUN_FRAG });
  const core = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 64, 64), sunMat);
  core.userData.id = "sun"; sunGroup.add(core);
  // layered corona
  for (const [s,o] of [[SUN_R*4.2,0.6],[SUN_R*2.6,0.7]]){
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTexture(), color:0xffb347, transparent:true,
      opacity:o, depthWrite:false, blending:THREE.AdditiveBlending }));
    sp.scale.set(s,s,1); sunGroup.add(sp);
  }
}

function planetTexture(hex, opts){
  const c = document.createElement("canvas"); c.width = 512; c.height = 256; const g = c.getContext("2d");
  const base = new THREE.Color(hex);
  const css = cc => `rgb(${cc.r*255|0},${cc.g*255|0},${cc.b*255|0})`;
  g.fillStyle = css(base); g.fillRect(0,0,512,256);
  for (let i=0;i<1100;i++){
    const x=Math.random()*512, y=Math.random()*256, r=Math.random()*20+3;
    const col = base.clone().offsetHSL((Math.random()-0.5)*0.04,(Math.random()-0.5)*0.10,(Math.random()-0.5)*0.45);
    g.globalAlpha = 0.05+Math.random()*0.08; g.fillStyle = css(col);
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  g.globalAlpha = 1;
  if (opts.bands){ for (let i=0;i<11;i++){ const y=Math.random()*256, h=4+Math.random()*18;
    const col = base.clone().offsetHSL(0,0.05,(Math.random()-0.5)*0.4); g.globalAlpha=0.16; g.fillStyle=css(col); g.fillRect(0,y,512,h); } g.globalAlpha=1; }
  if (opts.caps){ const cap=base.clone().offsetHSL(0,-0.25,0.45); g.fillStyle=css(cap);
    g.globalAlpha=0.5; g.fillRect(0,0,512,16); g.fillRect(0,240,512,16); g.globalAlpha=1; }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

const ATMO_VERT = `varying vec3 vN; varying vec3 vV;
  void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vN=normalMatrix*normal; vV=-mv.xyz; gl_Position=projectionMatrix*mv; }`;
const ATMO_FRAG = `varying vec3 vN; varying vec3 vV; uniform vec3 uColor; uniform float uPower; uniform float uIntensity;
  void main(){ float f=pow(1.0-max(dot(normalize(vN),normalize(vV)),0.0),uPower); gl_FragColor=vec4(uColor*uIntensity, f); }`;

function buildPlanet(id, v){
  const r = v.size * 0.1;
  const R = v.orbit * ORBIT;
  const group = new THREE.Group();

  const mat = new THREE.MeshStandardMaterial({ map:planetTexture(v.color, v.tex||{}), roughness:0.92, metalness:0.04,
    emissive:new THREE.Color(v.color).multiplyScalar(0.04) });
  const body = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 48), mat);
  body.userData.id = id; group.add(body);

  const atmo = new THREE.Mesh(new THREE.SphereGeometry(r*1.18, 48, 48), new THREE.ShaderMaterial({
    uniforms:{ uColor:{value:new THREE.Color(v.atmo)}, uPower:{value:3.2}, uIntensity:{value:0.9} },
    vertexShader:ATMO_VERT, fragmentShader:ATMO_FRAG, transparent:true, blending:THREE.AdditiveBlending,
    side:THREE.BackSide, depthWrite:false }));
  group.add(atmo);

  if (v.ring){
    const ring = new THREE.Mesh(new THREE.RingGeometry(r*1.5, r*2.4, 80),
      new THREE.MeshBasicMaterial({ color:0xffe6a0, transparent:true, opacity:0.5, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false }));
    ring.rotation.x = -1.15; ring.rotation.y = 0.2; group.add(ring);
  }

  scene.add(group);

  // faint orbit path (exact match to the planet's tilted circle)
  const pts = [];
  for (let k=0;k<=128;k++){ const a=k/128*TAU; pts.push(new THREE.Vector3(Math.cos(a)*R, Math.sin(a)*R*Math.sin(v.incl), Math.sin(a)*R*Math.cos(v.incl))); }
  const orbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:0x254863, transparent:true, opacity:0.4 }));
  scene.add(orbitLine);

  // connector beam (a cylinder we re-aim each frame)
  const conn = new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,12,1,true),
    new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false }));
  scene.add(conn);

  // travelling energy pulses for "in use"
  const parts = [];
  for (let i=0;i<5;i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(r*0.16+0.12, 12, 12),
      new THREE.MeshBasicMaterial({ color:0x9af0ff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
    m.visible = false; scene.add(m); parts.push(m);
  }

  // label
  const el = document.createElement("div"); el.className = "label mono";
  el.innerHTML = '<span class="dot"></span><span class="nm">'+v.name+'</span>';
  document.getElementById("labels").appendChild(el);

  planets.push({ id, v, r, orbitR:R, incl:v.incl, angle:Math.random()*TAU,
    group, body, atmo, conn, parts, el, dot:el.querySelector(".dot"),
    state:"online", active:false, label:v.name });
}

function nodeActive(p){ return p.active || (localActive[p.id]||0) > Date.now()-1200; }
function stateHex(p){ if (p.state==="absent") return 0xffce4d; if (p.state==="offline") return 0xff4d6a;
  if (nodeActive(p)) return 0x46e0ff; return 0xffffff; }
function dotColor(p){ if (p.state==="absent") return "#ffce4d"; if (p.state==="offline") return "#ff4d6a";
  if (nodeActive(p)) return "#46e0ff"; return "#ffffff"; }

const _v = () => new THREE.Vector3();
function updateConnector(p, t){
  const a = _v().set(0,0,0), b = p.group.position;
  const dir = b.clone().sub(a); const len = dir.length();
  p.conn.position.copy(a).add(b).multiplyScalar(0.5);
  p.conn.quaternion.setFromUnitVectors(_v().set(0,1,0), dir.clone().normalize());
  const active = nodeActive(p);
  let thick = 0.07, op = 0.5;
  if (p.state==="absent"){ thick=0.05; op=0.16; }
  else if (p.state==="offline"){ thick=0.10; op = REDUCE?0.55:0.4+0.3*Math.sin(t*4); }
  else if (active){ thick=0.16; op=0.9; }
  else { thick=0.07; op=0.5; }
  p.conn.scale.set(thick, len, thick);
  p.conn.material.color.setHex(stateHex(p));
  p.conn.material.opacity = op;
  // pulses
  const show = active && !REDUCE;
  for (let i=0;i<p.parts.length;i++){
    const m = p.parts[i];
    if (!show){ m.visible = false; continue; }
    m.visible = true;
    const f = ((t*0.45) + i/p.parts.length) % 1;
    m.position.copy(a).lerp(b, f);
  }
}

function updateLabels(){
  for (const p of planets){
    const v = p.group.position.clone().project(camera);
    const behind = v.z > 1;
    const x = (v.x*0.5+0.5)*W, y = (-v.y*0.5+0.5)*H;
    const dist = camera.position.distanceTo(p.group.position);
    const off = (p.r/dist) * (H/2) / Math.tan(FOV/2*Math.PI/180) + 12;
    p.el.style.transform = `translate(-50%,0) translate(${x}px,${y+off}px)`;
    p.el.style.opacity = behind ? 0 : 0.95;
    p.dot.style.color = dotColor(p);
  }
}

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now-lastT)/1000); lastT = now;
  const t = (now-startT)/1000;

  ox += ((REDUCE?0:pmx) - ox)*0.05; oy += ((REDUCE?0:pmy) - oy)*0.05;
  if (!REDUCE){ camAngle += dt*0.025; sunMat.uniforms.uTime.value = t; }
  const speaking = Date.now() < speakingUntil;
  const anyAct = planets.some(nodeActive);
  sunMat.uniforms.uBoost.value += (((speaking?0.5:0)+(anyAct?0.18:0)) - sunMat.uniforms.uBoost.value)*0.1;
  pointLight.intensity = 2.6 + sunMat.uniforms.uBoost.value*1.4;

  camera.position.x = Math.sin(camAngle + ox*0.5) * camR;
  camera.position.z = Math.cos(camAngle + ox*0.5) * camR;
  camera.position.y = camH + oy*8;
  camera.lookAt(0,0,0);
  sunGroup.rotation.y += (REDUCE?0:dt*0.05);

  for (const p of planets){
    if (!REDUCE) p.angle += (0.06/p.v.orbit) * dt * 0.18;
    const R = p.orbitR;
    p.group.position.set(Math.cos(p.angle)*R, Math.sin(p.angle)*R*Math.sin(p.incl), Math.sin(p.angle)*R*Math.cos(p.incl));
    if (!REDUCE) p.body.rotation.y += dt*0.15;
    updateConnector(p, t);
  }
  updateLabels();
  composer.render();
}

function onResize(){
  W = innerWidth; H = innerHeight;
  camera.aspect = W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H); composer.setSize(W,H);
}

/* hover + click via screen-space projection (no raycaster needed) */
function screenPos(p3){ const v = p3.clone().project(camera); return { x:(v.x*0.5+0.5)*W, y:(-v.y*0.5+0.5)*H, behind:v.z>1 }; }
function pick(mx,my){
  if (!sceneReady) return null;
  const sun = screenPos(_v().set(0,0,0));
  const sunDist = camera.position.length();
  const sunR = (SUN_R/sunDist)*(H/2)/Math.tan(FOV/2*Math.PI/180);
  if (!sun.behind && Math.hypot(mx-sun.x,my-sun.y) < Math.max(sunR, 34)) return "sun";
  let best=null, bd=1e9;
  for (const p of planets){
    const s = screenPos(p.group.position); if (s.behind) continue;
    const dist = camera.position.distanceTo(p.group.position);
    const r = (p.r/dist)*(H/2)/Math.tan(FOV/2*Math.PI/180);
    const d = Math.hypot(mx-s.x,my-s.y);
    if (d < Math.max(r+12,20) && d < bd){ bd=d; best=p; }
  }
  return best;
}
addEventListener("pointermove",(e)=>{ pmx=(e.clientX/W-0.5); pmy=(e.clientY/H-0.5);
  if (!renderer) return; const h=pick(e.clientX,e.clientY); renderer.domElement.style.cursor = h?"pointer":"default"; });
addEventListener("click",(e)=>{ if (!sceneReady) return; if (e.target.closest("#sheet,#card,#legend,#title,#panel,#fallback")) return;
  const h=pick(e.clientX,e.clientY); if (h==="sun") openSheet(); else if (h) showCard(h); else hideCard(); });

/* ============================ STATUS FEED ============================ */
async function poll(){
  try{
    const r = await fetch("/status",{ headers:{ "X-Sunny-Token":TOKEN } });
    if (!r.ok) return; const data = await r.json();
    let sun = "online", online = 0, total = 0;
    for (const node of (data.nodes||[])){
      total++; if (node.state==="online") online++;
      if (node.id==="sun"){ sun = node.state; continue; }
      const p = planets.find(x=>x.id===node.id);
      if (p){ p.state = node.state; p.active = !!node.active; }
    }
    const ro = document.getElementById("readout");
    ro.dataset.nodes = "NODES "+online+"/"+total+" ONLINE";
    ro.textContent = ro.dataset.nodes + "  ·  " + clock();
  }catch(e){}
}
function clock(){ return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"}); }
setInterval(()=>{ const ro=document.getElementById("readout"); if (ro.dataset.nodes) ro.textContent = ro.dataset.nodes+"  ·  "+clock(); },1000);

/* ============================ CARD ============================ */
const card = document.getElementById("card");
function showCard(p){
  document.getElementById("cardTitle").textContent = p.label;
  const st = p.state==="online" ? "● ONLINE" : p.state==="offline" ? "● DOWN" : "● NOT LINKED";
  const se = document.getElementById("cardState"); se.textContent = st;
  se.style.color = p.state==="online" ? "#fff" : p.state==="offline" ? "#ff4d6a" : "#ffce4d";
  document.getElementById("cardBody").textContent = ABOUT[p.id]||""; card.style.display = "block";
}
function hideCard(){ card.style.display = "none"; }
document.getElementById("cardX").onclick = hideCard;

/* ============================ CHAT / VOICE ============================ */
const sheet=document.getElementById("sheet"), log=document.getElementById("log"), form=document.getElementById("form"), input=document.getElementById("input");
const STORE="sunny_solar_chat"; let history=[]; try{ history=JSON.parse(localStorage.getItem(STORE)||"[]"); }catch(e){}
function openSheet(){ document.getElementById("hint").style.opacity=0; sheet.style.display="block";
  if(!log.childElementCount){ if(history.length) history.forEach(m=>render(m.role,m.text,false)); else render("her","Hi, I'm Sunny ☀️ Tap the mic and talk to me, or type.",false); } input.focus(); }
function closeSheet(){ sheet.style.display="none"; document.getElementById("hint").style.opacity=1; }
document.getElementById("scrim").onclick=closeSheet; document.getElementById("close").onclick=closeSheet;
document.getElementById("title").onclick=openSheet;
document.getElementById("title").addEventListener("keydown",(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openSheet(); } });

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(text){ let h=escapeHtml(text); const links=[];
  h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,a,u)=>{links.push('<a href="'+u+'" target="_blank" rel="noopener">'+a+'</a>');return "@@L"+(links.length-1)+"@@";});
  h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  h=h.replace(/`([^`]+)`/g,"<code>$1</code>"); h=h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  h=h.replace(/@@L(\d+)@@/g,(m,i)=>links[+i]); return h.replace(/\n/g,"<br>"); }
function render(role,text,save){ const row=document.createElement("div"); row.className="row "+(role==="me"?"me":"her");
  row.innerHTML=(role==="me"?"":'<div class="ava"></div>')+'<div class="bubble">'+fmt(text)+'</div>'; log.appendChild(row); log.scrollTop=log.scrollHeight;
  if(save){ history.push({role,text}); localStorage.setItem(STORE,JSON.stringify(history.slice(-120))); } }
function typing(){ const r=document.createElement("div"); r.className="row her typing";
  r.innerHTML='<div class="ava"></div><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>'; log.appendChild(r); log.scrollTop=log.scrollHeight; return r; }

const ICON_VOL='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';
const ICON_MUTE='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>';
let muted=localStorage.getItem("sunny_muted")==="1";
const muteBtn=document.getElementById("mute");
function setMute(){ muteBtn.innerHTML=muted?ICON_MUTE:ICON_VOL; muteBtn.setAttribute("aria-label",muted?"Unmute voice":"Mute voice");
  muteBtn.setAttribute("aria-pressed",muted?"true":"false"); muteBtn.title=muted?"Voice muted":"Mute voice"; }
setMute();
muteBtn.onclick=()=>{ muted=!muted; localStorage.setItem("sunny_muted",muted?"1":"0"); setMute(); if(muted) speechSynthesis.cancel(); };
function speak(text){ if(muted||!window.speechSynthesis) return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/https?:\/\/\S+/g,"link").slice(0,600)); u.rate=1.0; u.pitch=1.05;
  u.onstart=()=>{speakingUntil=Date.now()+600000;}; u.onend=()=>{speakingUntil=0;}; speechSynthesis.speak(u); }

async function ask(text,viaVoice){ render("me",text,true); localActive["web"]=Date.now(); if(viaVoice) localActive["voice"]=Date.now();
  const tEl=typing(); const flow=setInterval(()=>{localActive["web"]=Date.now(); if(viaVoice) localActive["voice"]=Date.now();},800);
  try{ const res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json","X-Sunny-Token":TOKEN},body:JSON.stringify({message:text})});
    const data=await res.json(); tEl.remove(); const reply=res.ok?(data.reply||"(no reply)"):("Error: "+(data.error||res.status)); render("her",reply,true); if(res.ok) speak(reply);
  }catch(e){ tEl.remove(); render("her","Couldn't reach Sunny — is she running? ("+e+")",true); } finally{ clearInterval(flow); } }

form.addEventListener("submit",(e)=>{ e.preventDefault(); const v=input.value.trim(); if(!v) return; input.value=""; input.style.height="auto"; ask(v,false); });
input.addEventListener("input",()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px"; });
input.addEventListener("keydown",(e)=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });
document.getElementById("newchat").onclick=async()=>{ history=[]; localStorage.removeItem(STORE); log.innerHTML=""; try{ await fetch("/reset",{method:"POST",headers:{"X-Sunny-Token":TOKEN}}); }catch(e){} render("her","Fresh start! What's up?",false); };

const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const micBtn=document.getElementById("mic"); let rec=null,listening=false;
if(SR){ rec=new SR(); rec.lang="en-US"; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onresult=(e)=>{ const txt=e.results[0][0].transcript; if(txt) ask(txt,true); };
  rec.onend=()=>{ listening=false; micBtn.classList.remove("listening"); };
  rec.onerror=()=>{ listening=false; micBtn.classList.remove("listening"); };
  micBtn.onclick=()=>{ if(listening){ rec.stop(); return; } try{ speechSynthesis.cancel(); rec.start(); listening=true; micBtn.classList.add("listening"); localActive["voice"]=Date.now(); }catch(e){} };
} else { micBtn.title="Voice not supported here — type instead"; micBtn.onclick=()=>input.focus(); micBtn.style.opacity=.5; }

document.getElementById("fbChat").onclick=openSheet;

/* ============================ START ============================ */
poll(); setInterval(poll,3000);
boot().catch(err=>{
  console.error("Sunny 3D failed:", err);
  document.getElementById("fallback").style.display="grid";
});
</script>
</body>
