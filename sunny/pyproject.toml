[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunny-assistant"
version = "0.1.0"
description = "Sunny — a personal AI assistant that lives on your PC and reaches you on your phone."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "requests>=2.31.0",
    # Runtime, not just dev: the self-improvement loop runs the test suite in a
    # sandbox before any change is proposed, so pytest must always be present.
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["sunny*"]

[tool.setuptools.package-data]
sunny = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
